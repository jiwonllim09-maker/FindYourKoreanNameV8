<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Your Korean Name</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>🇰🇷 Find Your Korean Name</h1>

    <p class="subtitle">
        Discover your Korean name powered by Gemini AI.
    </p>

    <div class="card">

        <label>Your First Name</label>

        <input
            id="name"
            type="text"
            placeholder="Michael">

        <label>Gender</label>

        <div class="gender-group">

            <label>
                <input
                    type="radio"
                    name="gender"
                    value="male"
                    checked>
                Male
            </label>

            <label>
                <input
                    type="radio"
                    name="gender"
                    value="female">
                Female
            </label>

        </div>

        <button id="generateBtn">
            Generate Korean Name
        </button>

    </div>

    <div id="loading" class="hidden">

        <div class="spinner"></div>

        <p>AI is creating your Korean name...</p>

    </div>

    <div id="result" class="hidden">

        <h2 id="koreanName"></h2>

        <p>
            <strong>Pronunciation</strong><br>
            <span id="pronunciation"></span>
        </p>

        <p>
            <strong>Meaning</strong><br>
            <span id="meaning"></span>
        </p>

        <p>
            <strong>Reason</strong><br>
            <span id="reason"></span>
        </p>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
