<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Your Korean Name</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
</head>

<body>

<div class="container">

    <div class="card">

        <h1>Find Your Korean Name</h1>

        <p class="subtitle">
            Generate your Korean identity with AI
        </p>

        <input
            id="name"
            type="text"
            placeholder="Enter your first name">

        <div class="gender">

            <label>
                <input type="radio" name="gender" value="Male" checked>
                Male
            </label>

            <label>
                <input type="radio" name="gender" value="Female">
                Female
            </label>

        </div>

        <button id="generateBtn">

            Generate

        </button>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
