<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Find Your Korean Name</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <h1>🇰🇷</h1>

    <h2>Find Your Korean Name</h2>

    <p class="subtitle">
        Discover a Korean name
    </p>

    <div class="card">

        <label>Your Name</label>

        <input
            id="nameInput"
            type="text"
            placeholder="Enter your name"
        >

        <label>Gender</label>

        <div class="gender">

            <label>
                <input
                    type="radio"
                    name="gender"
                    value="male"
                    checked
                >
                Male
            </label>

            <label>
                <input
                    type="radio"
                    name="gender"
                    value="female"
                >
                Female
            </label>

        </div>

        <button id="generateBtn">

            Generate

        </button>

    </div>

    <div id="loading">

        Generating your Korean name...

    </div>

    <div id="result" class="hidden">

        <h3>

            🇰🇷 Your Korean Name

        </h3>

        <div id="koreanName"></div>

        <div id="romanization"></div>

        <hr>

        <p>

            <strong>Original Name</strong>

        </p>

        <p id="originalName"></p>

        <p>

            <strong>Korean Pronunciation</strong>

        </p>

        <p id="pronunciation"></p>

        <p>

            <strong>Meaning</strong>

        </p>

        <p id="meaning"></p>

        <p>

            <strong>Why this name?</strong>

        </p>

        <p id="reason"></p>

        <div class="buttons">

            <button id="downloadBtn">

                Download Certificate

            </button>

            <button id="shareBtn">

                Share

            </button>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>

</html>
