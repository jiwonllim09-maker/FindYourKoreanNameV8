<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Discover a Korean Name</title>

    <meta name="description"
        content="Discover your Korean name powered by AI.">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🇰🇷</h1>

        <h2>Discover a Korean Name</h2>

        <p class="subtitle">
            Find the Korean name that matches your own.
        </p>

        <input
            id="nameInput"
            type="text"
            placeholder="Enter your name">

        <div class="gender">

            <label>
                <input
                    type="radio"
                    name="gender"
                    value="male"
                    checked>
                Male
            </label>

            <label>
                <input
                    type="radio"
                    name="gender"
                    value="female">
                Female
            </label>

        </div>

        <button id="generateBtn">
            Generate
        </button>

        <div id="loading" class="hidden">
            Generating your Korean name...
        </div>

        <div id="result" class="hidden">

            <div class="card">

                <h3>Your Korean Name</h3>

                <div id="koreanName" class="korean-name"></div>

                <div id="romanization" class="romanization"></div>

                <hr>

                <h4>Original Name</h4>
                <p id="originalName"></p>

                <h4>Pronunciation</h4>
                <p id="pronunciation"></p>

                <h4>Meaning</h4>
                <p id="meaning"></p>

                <h4>Why this name?</h4>
                <p id="reason"></p>

                <div id="certificate" class="certificate">
    <div class="cert-title">
        🇰🇷
        <br>
        Certificate of Korean Name
    </div>

    <div id="certKorean" class="cert-name">
        민결
    </div>

    <div id="certRoman" class="cert-roman">
        Min-gyeol
    </div>

    <div id="certMeaning" class="cert-meaning">
        Pure and noble
    </div>

    <div class="cert-footer">
        Discover a Korean name
    </div>


                </div>

<div class="buttons">

    <button id="shareBtn">
        Share
    </button>

    <button id="downloadBtn">
        Download Certificate
    </button>

</div>



            </div>

        </div>

    </div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="script.js"></script>

</body>

</html>
